name: electrician
description: "The quiz can be designed to be challenging but accessible to participants of all backgrounds, providing a fun and engaging way to learn new facts and refresh one's memory on known topics. Common quizzes are often used in schools, workplace training, quiz games, and community events to encourage learning and collaboration."
