name: Windows Build

on:
  workflow_dispatch:
    inputs:
      msix_version:
        description: MSIX version (major.minor.patch.0)
        type: string
        default: '1.0.4.0'
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Electrician Exam Prep NEC Windows Release
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      MSIX_VERSION: ${{ inputs.msix_version || '1.0.4.0' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup package validator
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test package validator
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create env asset
        env:
          API_KEY: ${{ secrets.API_KEY }}
          YOUR_KEY: ${{ secrets.YOUR_KEY }}
          YOUR_DB_KEY: ${{ secrets.YOUR_DB_KEY }}
          YOUR_DB_PASS_KEY: ${{ secrets.YOUR_DB_PASS_KEY }}
        run: |
          foreach ($name in @('API_KEY', 'YOUR_KEY', 'YOUR_DB_KEY', 'YOUR_DB_PASS_KEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required repository secret: $name"
            }
          }
          @(
            "API_KEY=$env:API_KEY"
            "YOUR_KEY=$env:YOUR_KEY"
            "YOUR_DB_KEY=$env:YOUR_DB_KEY"
            "YOUR_DB_PASS_KEY=$env:YOUR_DB_PASS_KEY"
          ) | Set-Content -Path .env -Encoding utf8NoBOM

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run tests
        run: flutter test

      - name: Build Windows release and MSIX
        run: ./scripts/build_windows.ps1 -Msix -MsixVersion $env:MSIX_VERSION

      - name: Upload Windows release folder
        uses: actions/upload-artifact@v4
        with:
          name: electrician-exam-prep-nec-windows-release
          # Required by flutter_dotenv at startup; included in this app artifact.
          include-hidden-files: true
          path: |
            build/windows/x64/runner/Release/**
            !build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

      - name: Upload MSIX package
        uses: actions/upload-artifact@v4
        with:
          name: electrician-exam-prep-nec-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error
